[package]
name = "tessel-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "TideOS Eval Kit (Tool 3): synthetic eval inputs from explicit dimension tuples with pairwise coverage guarantees."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TechTideOhio/tessel"
homepage = "https://techtideai.io"
documentation = "https://github.com/TechTideOhio/tessel#readme"
keywords = ["evals", "synthetic-data", "ai-agents", "pairwise", "harness"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "tessel"
path = "src/main.rs"

[lib]
name = "tessel"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
result_large_err = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
cast_precision_loss = "allow"
format_push_string = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
doc_markdown = "allow"
manual_string_new = "allow"
manual_let_else = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
rstest = { version = "0.23", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
